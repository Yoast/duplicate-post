name: Deploy

##############################################################################
# WARNING!
# The deploy workflow (re-)uses information retrieved from the original
# commit which triggered the workflow, such as the branch name, the committer,
# and the commit message.
#
# This type of data should always be regarded as **untrusted** input and when
# these `github....` variables are used directly within the `run` context,
# they can lead to script injection and unintended execution of commands.
#
# To mitigate the risk of these type of script injection attacks, untrusted
# data is first set as a step-specific interim environment variable and only
# after that the environment variable (not the github variables directly)
# is used in the `run` context.
#
# This complies with the current best practices regarding defending against
# these type of attacks as per January 2022.
# For more information, see:
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
##############################################################################

on:
  push:
    # Trigger the workflow on select branches.
    branches:
      - trunk
      - 'release/**'
      - 'hotfix/[0-9]+.[0-9]+*'
      - 'feature/**'
    # Trigger the workflow whenever a new tag is created.
    tags:
      - '**'
  # Allow manually triggering the workflow.
  workflow_dispatch:
  # Allow the release workflows to deploy the tag they just pushed. A push made with the
  # built-in Actions token raises no events, so a release workflow cannot rely on its own
  # tag push to trigger this workflow.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy. Pass the tag name for a release.'
        required: true
        type: string
      is-release:
        description: 'Deploy `ref` as a release: take the version from the ref name, sync to the dist default branch and tag it there.'
        required: false
        default: false
        type: boolean

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the deployed ref.
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  DIST_ORG: 'Yoast-dist'
  DIST_DEFAULT_BRANCH: 'main'
  # A `workflow_call` gets the ref to deploy and the release flag from the calling
  # workflow; `push` and `workflow_dispatch` derive both from the triggering ref.
  DEPLOY_REF_NAME: ${{ inputs.ref || github.ref_name }}
  IS_RELEASE: ${{ inputs.is-release || github.ref_type == 'tag' }}

jobs:
  prepare:
    name: "Prepare the artifact"
    # Don't run on forks.
    if: github.repository_owner == 'Yoast'

    runs-on: ubuntu-latest

    outputs:
      SHA: ${{ steps.set_metadata.outputs.SHA }}
      COMMIT_MSG: ${{ steps.set_metadata.outputs.COMMIT_MSG }}
      COMMIT_TIME: ${{ steps.set_metadata.outputs.COMMIT_TIME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: "Set variables: commit metadata"
        id: set_metadata
        # The `push` payload carries the commit that triggered the run, but the
        # `workflow_dispatch` and `workflow_call` payloads do not, so read the metadata
        # from the checked-out ref instead.
        run: |
          {
            echo "SHA=$(git rev-parse HEAD)"
            echo "COMMIT_TIME=$(git log -1 --format=%cI)"
            echo "COMMIT_MSG<<COMMIT_MSG_EOF"
            git log -1 --format=%B
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 7.4
          coverage: none
        env:
          fail-fast: true

      # https://github.com/actions/setup-node
      - name: Set up node and disable caching of dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: './.nvmrc'
          # Explicitly NOT using the cache functionality to prevent cache poisoning for deployments.
          cache: ''
          package-manager-cache: false

      - name: "Debug info: show tooling versions"
        run: |
          php -v
          node --version
          npm --version
          yarn --version
          grunt --version
          git --version

      # The Grunt artifact creation will run `composer install` twice (first: no-dev, then dev).
      # Explicitly NOT using the cache functionality via the `ramsey/composer-install`
      # action runner to prevent cache poisoning for deployments.

      - name: Yarn install
        run: yarn install

      - name: "Grunt: set package version (releases only)"
        if: ${{ env.IS_RELEASE == 'true' }}
        run: grunt set-version -new-version="$DEPLOY_REF_NAME"

      - name: "Grunt: update package version (releases only)"
        if: ${{ env.IS_RELEASE == 'true' }}
        run: grunt update-version

      - name: "Grunt: create artifact"
        run: grunt artifact

      - name: "Copy composer.json"
        run: cp composer.json ./artifact

      - name: "Debug info: show contents of artifacts directory"
        run: tree -aC ./artifact

      - name: "Debug info: check git status"
        run: git status -b -v -u

      # Retention is normally 90 days, but this artifact is only for review
      # and use in the next step, so no need to keep it for more than a day.
      - name: Upload the artifact folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() }}
        with:
          name: deploy-artifact
          path: ./artifact
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: "Deploy to dist"
    # Don't run on forks.
    if: github.repository_owner == 'Yoast'

    needs: prepare

    runs-on: ubuntu-latest

    steps:
      - name: "Set variable: short sha"
        id: set_sha
        env:
          SHA: ${{ needs.prepare.outputs.SHA }}
        run: |
          shortsha=$(echo "$SHA" | cut -b 1-6)
          echo "SHORTSHA=$shortsha" >> "$GITHUB_OUTPUT"

      - name: "Set variables: target branch, commit title"
        id: set_vars
        run: |
          # A release goes to the dist default branch and gets tagged there; any other ref
          # syncs to a same-named branch. A run on the dist default branch itself takes the
          # release path, as it did before.
          if [[ "$IS_RELEASE" == 'true' || "$DEPLOY_REF_NAME" == "${{ env.DIST_DEFAULT_BRANCH }}" ]]; then
            echo "BRANCH=${{ env.DIST_DEFAULT_BRANCH }}" >> "$GITHUB_OUTPUT"
            echo "TITLE=Release $DEPLOY_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == 'push' && "${{ github.ref_type }}" == 'branch' ]]; then
            echo "BRANCH=$DEPLOY_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TITLE=Syncing branch $DEPLOY_REF_NAME (sha: ${{ steps.set_sha.outputs.SHORTSHA }})" >> "$GITHUB_OUTPUT"
          else
            echo "BRANCH=$DEPLOY_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TITLE=Manual deploy for $DEPLOY_REF_NAME (sha: ${{ steps.set_sha.outputs.SHORTSHA }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Yoast Dist repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DIST_ORG }}/${{ github.event.repository.name }}
          ref: ${{ env.DIST_DEFAULT_BRANCH }}
          # Personal Access Token for (push) access to the dist version of the repo.
          token: ${{ secrets.YOASTBOT_CI_PAT_DIST }}
          fetch-depth: 0
          persist-credentials: true

      - name: "Create branch/Switch to branch"
        if: ${{ steps.set_vars.outputs.BRANCH != env.DIST_DEFAULT_BRANCH }}
        run: git checkout ${{ steps.set_vars.outputs.BRANCH }} 2>/dev/null || git checkout -b ${{ steps.set_vars.outputs.BRANCH }}

      # Clean out all files to make sure that deleted files will actually
      # be deleted when the artifact gets put in place.
      - name: Remove all files
        run: |
          # Enable extended pattern matching.
          shopt -s extglob
          # Remove everything, except the ".git" directory.
          rm -vrf !(.git/*)
          # Disable extended pattern matching.
          shopt -u extglob

      # After the previous step, only the `.git` directory and its contents should remain.
      - name: "Debug info: show contents of root directory after cleaning"
        run: tree -aC .

      # The artifact will be unpacked into the root directory of the repository.
      - name: Download and unpack the prepared artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-artifact

      # Remove the vendor directory from the artifact, composer will generate it's own autoload.
      - name: Remove generated vendor directory
        run: rm -vrf ./vendor

      - name: "Debug info: show contents of root directory after artifact insertion"
        run: tree -aC .

      - name: "Debug info: check git status"
        run: git status -b -v -u

      - name: Set Git config
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name 'GitHub Action'
          git config user.email "$ACTOR@users.noreply.github.com"

      - name: Stage files
        run: git add -A

      - name: "Commit the files (branch)"
        if: ${{ env.IS_RELEASE != 'true' }}
        env:
          COMMITTER: ${{ github.event.head_commit.committer.username || github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || needs.prepare.outputs.COMMIT_MSG }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, needs.prepare.outputs.SHA) }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp || needs.prepare.outputs.COMMIT_TIME }}
        run: |
          git commit --allow-empty -m "${{ steps.set_vars.outputs.TITLE }}" \
            -m "Synced up to commit hash: $COMMIT_URL" \
            -m "Timestamp last commit: $COMMIT_TIME" \
            -m "Committer last commit: @$COMMITTER" \
            -m "" \
            -m "Commit message last commit:" \
            -m "---------------------------" \
            -m "$COMMIT_MSG"

      - name: "Commit the files (release)"
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          COMMITTER: ${{ github.event.head_commit.committer.username || github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || needs.prepare.outputs.COMMIT_MSG }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, needs.prepare.outputs.SHA) }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp || needs.prepare.outputs.COMMIT_TIME }}
        run: |
          git commit -m "${{ steps.set_vars.outputs.TITLE }}" \
            -m "Commit hash for tag: $COMMIT_URL" \
            -m "Timestamp for tag: $COMMIT_TIME" \
            -m "Committer for tag: @$COMMITTER" \
            -m "" \
            -m "Commit message last commit:" \
            -m "---------------------------" \
            -m "$COMMIT_MSG"

      - name: "Tag the commit (releases only)"
        if: ${{ env.IS_RELEASE == 'true' }}
        run: git tag "$DEPLOY_REF_NAME" "$(git rev-parse HEAD)"

      - name: Push to target branch
        run: git push -u origin ${{ steps.set_vars.outputs.BRANCH }} --tags -v
